name: Android APK

# Wraps the taxi meter web app with Capacitor and builds an installable (sideload) APK.
# The Android project is generated fresh on every run (it is not committed); the
# customisations live in tools/android-patch.sh and android-res/.
# Runs by hand from the Actions tab, and on pushes to main that touch the app.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "tests/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: write # publish the APK as a GitHub release

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: node tests/run.js

      - name: Build the web bundle
        run: ./build-site.sh "$GITHUB_WORKSPACE/www"

      - name: Generate and customise the Android project
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          npx cap add android
          tools/android-patch.sh
          npx cap sync android

      - name: Build the debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Keep the APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: taxi-meter-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish the APK as a release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk taxi-meter.apk
          cat > notes.md <<'EOF'
          택시 미터기 시뮬레이터 Android 테스트 빌드 (APK).

          - 폰에서 이 페이지의 `taxi-meter.apk`를 받아 설치하세요. "출처를 알 수 없는 앱 설치"를 허용해야 할 수 있습니다.
          - **참고용 요금 시뮬레이터**입니다. 실제 택시 요금과 다를 수 있고 법정 택시미터기를 대체하지 않습니다.
          - 공개 저장소에 올라 있는 고정 테스트 키로 서명되어 있어 **개인 테스트용**입니다(플레이스토어 배포용 아님).
          - 새 빌드는 이전 빌드 위에 그대로 설치(업데이트)되며 운행 기록이 유지됩니다.
          - GPS 거리 측정을 위해 위치 권한이 필요하고, 앱이 켜져 있는 동안 화면이 꺼지지 않습니다.
          EOF
          gh release delete android-latest --cleanup-tag --yes || true
          gh release create android-latest taxi-meter.apk \
            --title "Android APK (build ${{ github.run_number }})" \
            --notes-file notes.md --prerelease --target "$GITHUB_SHA"
